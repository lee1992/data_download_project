merge:
  background: '#1a1a2e'
  cols: 3
  enabled: true
  font_size: 24
  label_height: 40
  max_per_sheet: 9
  output_suffix: _combined
  thumb_width: 960
output:
  charts_dir: ./charts
  results_dir: ./results
prompt:
  screening: '
 以下是最终要求，但可能开始的数据不够清晰，我需要你为了下面的目标做一轮初筛，找到你认为浪形结构清晰确定都高的，然后再给你更清晰的图片。
  附件是一组股票的多周期技术图表。请帮我做筛选评估：


    !!!特别提示 如果有标的的图缺失 不清楚 一定给与提示 并降低确信度
    ！！！做技术相关分析时，只能用我给你的图中的信息  不要用网络上的其他信息
    不一定非要做多，也要考虑是否适合做空，最后的总结时 同时考虑一下估值水平， 但分开打分
    对每个标的，请：

    1. 标注当前所在浪型结构

    2. 评估结构确定性（高/中/低）

    3. 给出综合评分（1-10分）

    4. 最终分类：A（强烈做多候选）/ B（考虑做多）/ C（不确定）/ D（考虑做空）/E(强烈做空候选)
    
    5.给出后续的波形预测，可能的 子浪的形态 和 范围空间 时间范围

    6. 基本面估值等评价和打分， 与3的综合评分独立评分，不列入最终分类的考虑范围
    
    最后请汇总输出一个表格，列出：标的 | 浪型 | 评分 | 分类'
  wave_analysis: '请基于我上传的 TradingView 蜡烛图进行波浪理论分析。


    图片说明：

    - 每张合图包含同一标的的多个周期（从年线到5分钟），从左到右、从上到下依次排列

    - 请先从年线/月线建立大级别方向，再向下细化至日线、小时线和分钟线


    分析要求：
    !!!特别提示 如果有标的的图缺失 不清楚 一定给与提示 并降低确信度

    1. 波浪分析至少细分四个层级浪型（周期级 / 主浪级 / 中级浪 / 小级浪）

    2. 判断当前所处浪型结构（推动浪 / 调整浪，以及具体浪号）

    3. 给出 2-3 个高概率结构路径，并说明触发条件和失效条件

    4. 结合江恩和道氏原理，标出关键支撑/压力位(也结合这些判断浪形，并给出哪些位置破位后会转换成什么浪形，并给出概率)

    5. 判断该标的是否属于：刚启动(3浪初期) / 主升延长 / 5浪延伸 / 调整中 / 见顶嫌疑
    
    6. 给出时间和目标价格的预期

    7. 最终给出一个综合评分（1-10分）和买卖建议，和关注的位置点，什么时候、什么价格 你估计的几种假设切换，或者概率倾斜（所以分析的时候一定要给几种可能性或者后续演变的情况、条件、概率）。


        请严格依据图片的价格数据分析，不要用网上的价格数据，每个路径请单独标注概率（高/中/低）。
    8. 若存在指数、板块etf、大宗商品、贵金属类，优先分析，并考虑他们的相关性，最后给一个综合评估。后结合强、弱势指数，在分析美股权重股的时候，结合分析一下。
    9. 对于确定度的 高买入 或 做空的，  指数 和 股票 ， 各自确定度高的前两个，做短时的详细分析（用波浪理论 结合江恩 道氏 和 其他技术分析指标）给出未来1-2个交易日的短期浪形预测（各给出2-3个种高概率的情形和 情况转变的条件）
        
    '
